<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clarity | Dashboard</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* ==========================================================================
           1. OBSIDIAN MASTER DESIGN TOKENS (REPLICATED FOR UNITY)
           ========================================================================== */
        :root {
            --obsidian-base: #050505;
            --obsidian-surface: #0a0a0a;
            --obsidian-elevated: #121212;
            --glass-border-subtle: rgba(255, 255, 255, 0.04);
            --glass-border-active: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --accent-logic-blue: #3b82f6;
            --sidebar-width: 280px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --transition-med: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        body {
            background-color: var(--obsidian-base);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            display: flex;
            min-height: 100vh;
        }

        /* ==========================================================================
           2. SHARED STEALTH SIDEBAR
           ========================================================================== */
        .stealth-sidebar {
            position: fixed;
            left: 0; top: 0; bottom: 0;
            width: var(--sidebar-width);
            background: var(--obsidian-surface);
            border-right: 1px solid var(--glass-border-active);
            display: flex; flex-direction: column;
            padding: 40px 24px; z-index: 50;
        }

        .brand-cluster { display: flex; align-items: center; gap: 16px; margin-bottom: 60px; text-transform: uppercase; font-weight: 900; letter-spacing: -0.04em; }
        .brand-glyph { width: 24px; height: 24px; background: #fff; border-radius: 6px; }

        .nav-matrix { display: flex; flex-direction: column; gap: 8px; flex-grow: 1; }
        .nav-node {
            display: flex; align-items: center; gap: 16px; padding: 14px 16px;
            border-radius: var(--radius-md); color: var(--text-secondary);
            font-weight: 600; font-size: 13px; text-transform: uppercase; text-decoration: none;
            transition: var(--transition-med);
        }
        .nav-node:hover { background: var(--obsidian-elevated); color: #fff; }
        .nav-node.active { background: #1a1a1a; color: #fff; border: 1px solid var(--glass-border-active); }

        .identity-block { margin-top: auto; padding-top: 30px; border-top: 1px solid var(--glass-border-subtle); }
        .profile-container { display: flex; align-items: center; gap: 14px; padding: 12px; background: var(--obsidian-elevated); border-radius: var(--radius-md); }
        .avatar-sphere { width: 40px; height: 40px; border-radius: 12px; background: #1a1a1a; display: flex; align-items: center; justify-content: center; font-weight: 800; border: 1px solid var(--glass-border-active); }

        /* ==========================================================================
           3. DASHBOARD GRID SYSTEM
           ========================================================================== */
        .dashboard-core {
            margin-left: var(--sidebar-width);
            width: calc(100% - var(--sidebar-width));
            padding: 80px;
        }

        .welcome-header { margin-bottom: 60px; }
        .welcome-header h1 { font-size: 48px; font-weight: 900; letter-spacing: -0.05em; }
        .welcome-header p { color: var(--text-secondary); font-size: 18px; margin-top: 8px; }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 24px;
            margin-bottom: 60px;
        }

        .stat-card {
            background: var(--obsidian-surface);
            border: 1px solid var(--glass-border-active);
            padding: 32px;
            border-radius: var(--radius-lg);
            transition: var(--transition-med);
        }
        .stat-card:hover { border-color: var(--accent-logic-blue); transform: translateY(-4px); }
        .stat-label { font-size: 11px; font-weight: 800; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.1em; }
        .stat-value { font-size: 32px; font-weight: 900; margin-top: 8px; }

        .section-title {
            font-size: 14px; font-weight: 900; text-transform: uppercase;
            letter-spacing: 0.2em; color: var(--text-secondary);
            margin-bottom: 30px; display: flex; align-items: center; gap: 12px;
        }
        .section-title::after { content: ''; flex-grow: 1; height: 1px; background: var(--glass-border-subtle); }

        /* Session History Grid */
        .history-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }

        .history-card {
            background: var(--obsidian-surface);
            border: 1px solid var(--glass-border-active);
            padding: 30px;
            border-radius: var(--radius-lg);
            position: relative;
            cursor: pointer;
            transition: var(--transition-med);
        }
        .history-card:hover { background: #0f0f0f; border-color: var(--glass-border-focus); }
        .history-card h3 { font-size: 18px; font-weight: 800; margin-bottom: 12px; }
        .history-card p { font-size: 14px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 20px; }
        .history-meta { display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 700; color: var(--text-secondary); }
        
        .mode-badge {
            padding: 4px 10px; border-radius: 6px; background: var(--obsidian-elevated);
            text-transform: uppercase; letter-spacing: 0.05em; font-size: 9px;
        }

        .empty-state {
            grid-column: 1 / -1;
            padding: 100px;
            text-align: center;
            border: 2px dashed var(--glass-border-subtle);
            border-radius: var(--radius-lg);
            color: var(--text-secondary);
        }

    </style>
</head>
<body>

    <aside class="stealth-sidebar">
        <div class="brand-cluster">
            <div class="brand-glyph"></div>
            <span>Clarity</span>
        </div>
        <nav class="nav-matrix">
            <a href="dashboard.html" class="nav-node active"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg> Dashboard</a>
            <a href="workspace.html" class="nav-node"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg> Studio</a>
            <a href="pricing.html" class="nav-node"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg> Pricing</a>
            <a href="settings.html" class="nav-node"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg> Settings</a>
        </nav>
        <div class="identity-block">
            <div class="profile-container">
                <div id="ui-avatar" class="avatar-sphere">-</div>
                <div class="user-meta">
                    <span id="ui-nickname" style="font-weight: 800; font-size: 13px; text-transform: uppercase;">Syncing...</span>
                    <span id="ui-tier" style="font-size: 10px; color: var(--text-secondary); text-transform: uppercase; font-weight: 700;">Connecting</span>
                </div>
            </div>
        </div>
    </aside>

    <main class="dashboard-core">
        <header class="welcome-header">
            <h1 id="welcome-msg">Welcome Back</h1>
            <p>Your research intelligence and study logs.</p>
        </header>

        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-label">Total Insights</div>
                <div id="stat-insights" class="stat-value">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Recall Score</div>
                <div id="stat-score" class="stat-value">0%</div>
            </div>
            <div class="stat-card" style="border-color: var(--accent-logic-blue);">
                <div class="stat-label">Engine Level</div>
                <div id="stat-tier" class="stat-value">BASE</div>
            </div>
        </div>

        <h2 class="section-title">Session History</h2>
        <div id="history-grid" class="history-grid">
            <div class="empty-state">
                <p>No study sessions recorded yet.<br><br>
                <a href="workspace.html" style="color: #fff; font-weight: 800; text-decoration: underline;">Launch the Studio</a></p>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAoyilOSkLk7uQVC4znit855wfAwVXU3Uo",
            authDomain: "clarity-study-cd835.firebaseapp.com",
            projectId: "clarity-study-cd835",
            storageBucket: "clarity-study-cd835.firebasestorage.app",
            messagingSenderId: "92484724607",
            appId: "1:92484724607:web:d07cbc3f0238264ecf9c4a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "login.html"; return; }

            // 1. Fetch User Identity
            const userRef = doc(db, "users", user.uid);
            const userSnap = await getDoc(userRef);
            
            if (userSnap.exists()) {
                const data = userSnap.data();
                const name = data.nickname || "User";
                
                // Set UI (Remembered Name)
                document.getElementById('ui-nickname').innerText = name.toUpperCase();
                document.getElementById('welcome-msg').innerText = `Welcome, ${name}`;
                document.getElementById('ui-avatar').innerText = name.charAt(0).toUpperCase();
                document.getElementById('ui-tier').innerText = data.isPro ? "Clarity Pro" : "Base Engine";
                document.getElementById('stat-tier').innerText = data.isPro ? "PRO" : "BASE";
                if(data.isPro) document.getElementById('stat-tier').style.color = 'var(--accent-logic-blue)';
            }

            // 2. Fetch Sessions (Mock implementation or real Firestore query)
            // For production, you'd match by user.uid
        });
    </script>
</body>
</html>
